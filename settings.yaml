settings:
  type: "ssh"
  ssh_user: "isard"
  ssh_timeout: 5
  max_threads: 10
  version: "1.0.0"
  directory:
    data: "/tmp"
    binary: "/usr/local/bin"
    settings: "/etc/sentinella"

buttons:
  - title: "Desactiva internet"
    unique_word: "disable"
    color: "#FFFFFF"
    background_color: "#007BFF"
    command: "touch /tmp/sentinella"

  - title: "Activa internet"
    unique_word: "enable"
    color: "#FFFFFF"
    background_color: "#007BFF"
    command: "rm --force /tmp/sentinella"

  - title: "Comprova Google"
    unique_word: "enable"
    color: "#FFFFFF"
    background_color: "#007BFF"
    command: "ping -c 4 www.google.com"